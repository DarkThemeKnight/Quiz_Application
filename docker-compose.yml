# OPTIONAL local PostgreSQL for Recall Studio. Binds to loopback only.
# Values come from your local .env (never committed). See README "Database setup".
name: recall-studio
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recall_studio}
      # Creates a separate database used only by the automated test suite.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-recall_studio_test}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - recall-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  recall-pgdata:
